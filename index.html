<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Video</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Monetag SDK -->
    <script src='//libtl.com/sdk.js' data-zone='12214110' data-sdk='show_12214110'></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #000; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }
        
        #feed-view { height: calc(100vh - 60px); width: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
        #feed-view::-webkit-scrollbar { display: none; }
        
        .video-card { height: calc(100vh - 60px); width: 100%; scroll-snap-align: start; position: relative; background: #111; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        
        /* Play/Pause Center Indicator Icon */
        .play-pause-indicator { position: absolute; font-size: 70px; color: rgba(255,255,255,0.85); background: rgba(0,0,0,0.4); width: 90px; height: 90px; border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity 0.3s ease; z-index: 10; }
        .play-pause-indicator.show { opacity: 1; }

        .video-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 15px; background: linear-gradient(transparent, rgba(0,0,0,0.85)); display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; z-index: 5; }
        .user-info { pointer-events: auto; max-width: 70%; }
        .author-badge { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #2b82ff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; border: 2px solid #fff; }
        .author-name { font-weight: 700; font-size: 16px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .caption { font-size: 14px; color: #eee; line-height: 1.4; word-wrap: break-word; margin-top: 8px; }
        
        .actions { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .action-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; }
        .heart-icon { font-size: 30px; transition: transform 0.2s; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .heart-icon.liked { color: #ff2b55; transform: scale(1.15); }
        .count-text { font-size: 11px; font-weight: 700; text-align: center; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        .ad-badge-btn {
            background: linear-gradient(135deg, rgba(255, 43, 85, 0.85), rgba(180, 20, 50, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(255, 43, 85, 0.4);
            animation: pulseAd 2s infinite;
        }
        @keyframes pulseAd {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 43, 85, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(255, 43, 85, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 43, 85, 0); }
        }

        .big-heart { position: absolute; font-size: 80px; color: #ff2b55; pointer-events: none; animation: popHeart 0.8s ease-out forwards; z-index: 15; }
        @keyframes popHeart { 0% { transform: scale(0); opacity: 1; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

        #profile-view { display: none; height: calc(100vh - 60px); width: 100%; overflow-y: auto; background: #0f0f0f; padding: 20px; }
        .profile-header { text-align: center; padding: 20px 0; border-bottom: 1px solid #222; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: #2b82ff; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; }
        .profile-stats { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .stat-box span { display: block; font-size: 15px; font-weight: bold; }
        .stat-box small { color: #888; font-size: 10px; }
        .video-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 15px; }
        .grid-item { aspect-ratio: 9/16; background: #222; position: relative; overflow: hidden; border-radius: 4px; cursor: pointer; }
        .grid-item video { width: 100%; height: 100%; object-fit: cover; }
        .grid-stats { position: absolute; bottom: 5px; left: 5px; font-size: 10px; background: rgba(0,0,0,0.6); padding: 2px 5px; border-radius: 4px; display: flex; gap: 6px; }
        .delete-btn { position: absolute; top: 5px; right: 5px; background: rgba(255,0,0,0.8); color: #fff; border: none; border-radius: 4px; padding: 3px 6px; font-size: 11px; cursor: pointer; }

        #upload-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: flex-end; }
        .modal-content { background: #1c1c1e; width: 100%; border-radius: 20px 20px 0 0; padding: 24px; }
        .file-box { border: 2px dashed #444; border-radius: 12px; padding: 25px; text-align: center; margin: 15px 0; cursor: pointer; color: #aaa; display: block; }
        textarea { width: 100%; background: #2c2c2e; border: none; border-radius: 10px; padding: 12px; color: #fff; font-size: 15px; resize: none; height: 80px; margin-bottom: 15px; }
        
        .progress-container { width: 100%; background: #333; border-radius: 8px; margin-bottom: 15px; overflow: hidden; display: none; }
        .progress-bar { width: 0%; height: 18px; background: #2b82ff; text-align: center; font-size: 11px; font-weight: bold; line-height: 18px; color: #fff; transition: width 0.2s; }

        .modal-btns { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn-cancel { background: #3a3a3c; color: #fff; }
        .btn-post { background: #2b82ff; color: #fff; }
        .btn-post:disabled { opacity: 0.5; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 50; }
        .nav-btn { background: none; border: none; color: #888; font-size: 24px; cursor: pointer; padding: 10px; }
        .nav-btn.active { color: #fff; }
        .add-btn { background: #2b82ff; color: #fff; width: 46px; height: 34px; border-radius: 10px; font-size: 24px; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }
        
        .loader { text-align: center; padding: 40px; color: #888; }
        .back-btn { background: #222; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; margin-bottom: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Main Video Feed -->
    <div id="feed-view">
        <div class="loader">Loading videos...</div>
    </div>

    <!-- User / My Profile View -->
    <div id="profile-view"></div>

    <!-- Upload Modal -->
    <div id="upload-modal">
        <div class="modal-content">
            <div style="background: linear-gradient(135deg, #ff2b55, #ff7b00); padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; box-shadow: 0 4px 15px rgba(255,43,85,0.3);">
    <h4 style="font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 2px;">🎁 Monetization & Rewards Program</h4>
    <p style="font-size: 11px; color: #ffe6e8;">Upload popular videos, gain views, and earn cash soon! Upcoming feature.</p>
</div>
            <h3>Upload New Video</h3>
            <label class="file-box" id="file-label" for="video-input">
                📁 Select Video (Max 25 MB)
            </label>
            <input type="file" id="video-input" accept="video/mp4,video/webm,video/quicktime" style="display:none;" onchange="handleFileSelect(event)">
            
            <textarea id="caption-input" placeholder="Write a caption..."></textarea>
            
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar">0%</div>
            </div>

            <div class="modal-btns">
                <button class="btn btn-cancel" onclick="closeUploadModal()">Cancel</button>
                <button class="btn btn-post" id="post-btn" onclick="uploadVideo()">Post</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-btn active" id="nav-home" onclick="showFeed()">🏠</button>
        <button class="add-btn" onclick="openUploadModal()">+</button>
        <button class="nav-btn" id="nav-profile" onclick="openMyProfile()">👤</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://rkkuzkwfderknxpenyni.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lZdvaKrvEi-7hzixWrOCzA_FoJxJ56b';
        const BACKEND_UPLOAD_URL = 'https://video-backend-7mbc.onrender.com/upload';
        
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const hasTelegramUser = !!tg?.initDataUnsafe?.user;
        const tgUser = tg?.initDataUnsafe?.user || {
            id: 'guest_' + Math.floor(Math.random() * 100000),
            first_name: 'Guest User',
            username: 'guest'
        };

        const currentUser = {
            id: String(tgUser.id),
            name: [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' '),
            username: tgUser.username || 'user',
            isGuest: !hasTelegramUser
        };

        let allVideos = [];
        let userLikedVideoIds = new Set();
        let userFollowingSet = new Set();
        let viewedSessionSet = new Set();
        let scrollCount = 0;

        async function initApp() {
            if (!currentUser.isGuest) {
                await fetchUserLikes();
                await fetchUserFollowing();
            }
            await loadVideos();
        }

        async function fetchUserLikes() {
            const { data } = await sbClient.from('likes').select('video_id').eq('user_id', currentUser.id);
            if (data) userLikedVideoIds = new Set(data.map(item => item.video_id));
        }

        async function fetchUserFollowing() {
            const { data } = await sbClient.from('follows').select('following_id').eq('follower_id', currentUser.id);
            if (data) userFollowingSet = new Set(data.map(item => item.following_id));
        }

        async function loadVideos() {
            const feedEl = document.getElementById('feed-view');
            // সর্বাধিক ভিউ (views_count) এবং লাইক (likes_count) অনুযায়ী ভিডিওগুলো উপরে নিয়ে আসার লজিক
            const { data, error } = await sbClient.from('videos').select('*')
                .order('views_count', { ascending: false })
                .order('likes_count', { ascending: false })
                .order('created_at', { ascending: false });
            
            if (error) {
                feedEl.innerHTML = `<div class="loader">Database connection error! Check tables or keys.</div>`;
                return;
            }

            allVideos = data || [];
            if (allVideos.length === 0) {
                feedEl.innerHTML = `<div class="loader">No videos yet. Click the + button below to upload!</div>`;
                return;
            }

            renderFeed(allVideos);
            
            const startParam = tg?.initDataUnsafe?.start_param;
            if (startParam && startParam.startsWith('video_')) {
                try {
                    const targetVideoId = startParam.replace('video_', '');
                    setTimeout(() => {
                        const targetCard = document.querySelector(`.video-card[data-id="${targetVideoId}"]`);
                        if (targetCard) {
                            targetCard.scrollIntoView({ behavior: 'smooth' });
                        }
                    }, 500);
                } catch (e) {
                    console.log(e);
                }
            }
        }

        function renderFeed(videos) {
            const feedEl = document.getElementById('feed-view');
            feedEl.innerHTML = videos.map(v => {
                const isLiked = userLikedVideoIds.has(v.id);
                const isFollowing = userFollowingSet.has(v.user_id);
                const initial = v.user_name ? v.user_name[0].toUpperCase() : 'U';
                const showFollowBtn = (currentUser.id !== String(v.user_id));
                
                return `
                <div class="video-card" data-id="${v.id}" ondblclick="handleDoubleTap(event, '${v.id}')">
                    <video src="${v.video_url}" loop playsinline preload="auto" onclick="togglePlay(this, '${v.id}')"></video>
                    <div class="play-pause-indicator" id="indicator-${v.id}">⏸</div>
                    <div class="video-overlay">
                        <div class="user-info">
                            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                                <div class="author-badge" onclick="openUserProfile('${v.user_id}', '${escapeHtml(v.user_name)}', '${escapeHtml(v.username || '')}')">
                                    <div class="avatar">${initial}</div>
                                    <div class="author-name">${escapeHtml(v.user_name)}</div>
                                </div>
                                
                                ${showFollowBtn && !currentUser.isGuest ? `
                                    <button onclick="toggleFollow('${v.user_id}', this)" style="padding: 4px 12px; border-radius: 15px; border: none; font-size: 11px; font-weight: bold; background: ${isFollowing ? 'rgba(255,255,255,0.3)' : '#2b82ff'}; color: #fff; cursor: pointer;">
                                        ${isFollowing ? 'Following' : '+ Follow'}
                                    </button>
                                ` : ''}
                            </div>
                            <div class="caption">${escapeHtml(v.caption || '')}</div>
                        </div>
                        <div class="actions">
                            <button class="action-btn" onclick="toggleLike('${v.id}')">
                                <span class="heart-icon ${isLiked ? 'liked' : ''}" id="heart-${v.id}">♥</span>
                                <span class="count-text" id="like-count-${v.id}">${v.likes_count || 0}</span>
                            </button>

                            <button class="action-btn" onclick="toggleMute('${v.id}')">
                                <span style="font-size: 22px;" id="mute-icon-${v.id}">🔊</span>
                                <span class="count-text" id="mute-text-${v.id}">Sound</span>
                            </button>

                            <a href="https://auctionr.org/4/dd298209280bfd2d1700168d31b92186" target="_blank" class="ad-badge-btn">
                                <span style="font-size: 18px;">🔥</span>
                                <span class="count-text" style="color: #fff; font-size: 10px;">Hot Offer</span>
                            </a>

                            <button class="action-btn" onclick="shareVideo('${v.id}')">
                                <span style="font-size: 20px;">↗️</span>
                                <span class="count-text">Share</span>
                            </button>

                            <button class="action-btn" onclick="reportVideo('${v.id}')">
                                <span style="font-size: 20px;">⚠️</span>
                                <span class="count-text">Report</span>
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');

            setupAutoPlay();
        }

        function setupAutoPlay() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    const videoId = entry.target.getAttribute('data-id');
                    if (!video) return;

                    if (entry.isIntersecting) {
                        video.muted = false;
                        video.play().catch(() => {
                            video.muted = true;
                            video.play().catch(() => {});
                            updateMuteButtonUI(videoId, true);
                        });
                        
                        updateMuteButtonUI(videoId, video.muted);

                        if (videoId && !viewedSessionSet.has(videoId)) {
                            viewedSessionSet.add(videoId);
                            incrementVideoView(videoId);
                        }
                        
                        scrollCount++;
                        if (scrollCount % 3 === 0 && typeof show_12214110 === 'function') {
                            show_12214110().catch(e => console.log(e));
                        }
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                });
            }, { threshold: 0.7 });

            document.querySelectorAll('.video-card').forEach(card => observer.observe(card));
        }

        function toggleMute(videoId) {
            const card = document.querySelector(`.video-card[data-id="${videoId}"]`);
            const video = card ? card.querySelector('video') : null;
            if (!video) return;

            video.muted = !video.muted;
            updateMuteButtonUI(videoId, video.muted);
        }

        function updateMuteButtonUI(videoId, isMuted) {
            const iconEl = document.getElementById(`mute-icon-${videoId}`);
            const textEl = document.getElementById(`mute-text-${videoId}`);
            if (iconEl && textEl) {
                if (isMuted) {
                    iconEl.innerText = '🔇';
                    textEl.innerText = 'Muted';
                } else {
                    iconEl.innerText = '🔊';
                    textEl.innerText = 'Sound';
                }
            }
        }

        async function incrementVideoView(videoId) {
            const video = allVideos.find(v => v.id === videoId);
            if (!video) return;
            
            video.views_count = (video.views_count || 0) + 1;
            await sbClient.from('videos').update({ views_count: video.views_count }).eq('id', videoId);
        }

        function togglePlay(video, videoId) {
            const indicator = document.getElementById(`indicator-${videoId}`);
            if (video.paused) {
                video.play();
                indicator.innerText = '▶';
            } else {
                video.pause();
                indicator.innerText = '⏸';
            }
            
            indicator.classList.add('show');
            setTimeout(() => {
                indicator.classList.remove('show');
            }, 600);
        }

        function handleDoubleTap(e, videoId) {
            const heart = document.createElement('div');
            heart.className = 'big-heart';
            heart.innerText = '♥';
            heart.style.left = (e.clientX - 40) + 'px';
            heart.style.top = (e.clientY - 40) + 'px';
            e.currentTarget.appendChild(heart);
            setTimeout(() => heart.remove(), 800);

            if (!userLikedVideoIds.has(videoId)) {
                toggleLike(videoId);
            }
        }

        async function toggleLike(videoId) {
            if (currentUser.isGuest) {
                alert('Please open this app inside Telegram to like or interact!');
                return;
            }

            const heartEl = document.getElementById(`heart-${videoId}`);
            const countEl = document.getElementById(`like-count-${videoId}`);
            const video = allVideos.find(v => v.id === videoId);
            if (!video) return;

            const isLiked = userLikedVideoIds.has(videoId);

            if (isLiked) {
                userLikedVideoIds.delete(videoId);
                video.likes_count = Math.max(0, (video.likes_count || 1) - 1);
                heartEl?.classList.remove('liked');
                if (countEl) countEl.innerText = video.likes_count;

                await sbClient.from('likes').delete().match({ video_id: videoId, user_id: currentUser.id });
                await sbClient.from('videos').update({ likes_count: video.likes_count }).eq('id', videoId);
            } else {
                userLikedVideoIds.add(videoId);
                video.likes_count = (video.likes_count || 0) + 1;
                heartEl?.classList.add('liked');
                if (countEl) countEl.innerText = video.likes_count;

                await sbClient.from('likes').insert({ video_id: videoId, user_id: currentUser.id });
                await sbClient.from('videos').update({ likes_count: video.likes_count }).eq('id', videoId);
            }
        }

        async function toggleFollow(targetUserId, btnElement) {
            if (currentUser.isGuest) {
                alert('Please open this app inside Telegram to follow creators!');
                return;
            }

            const isFollowing = userFollowingSet.has(targetUserId);

            if (isFollowing) {
                userFollowingSet.delete(targetUserId);
                btnElement.innerText = '+ Follow';
                btnElement.style.background = '#2b82ff';

                await sbClient.from('follows').delete().match({ follower_id: currentUser.id, following_id: targetUserId });
            } else {
                userFollowingSet.add(targetUserId);
                btnElement.innerText = 'Following';
                btnElement.style.background = 'rgba(255,255,255,0.3)';

                await sbClient.from('follows').insert({ follower_id: currentUser.id, following_id: targetUserId });
            }
        }

        function shareVideo(videoId) {
            const botUsername = "Videohub7bot"; 
            
            const miniAppShareUrl = `https://t.me/${botUsername}/app?startapp=video_${videoId}`;
            const text = "Check out this amazing video on Mini Video!";
            const telegramShareUrl = `https://t.me/share/url?url=${encodeURIComponent(miniAppShareUrl)}&text=${encodeURIComponent(text)}`;

            if (window.Telegram?.WebApp && window.Telegram.WebApp.openTelegramLink) {
                window.Telegram.WebApp.openTelegramLink(telegramShareUrl);
            } else {
                window.open(telegramShareUrl, '_blank');
            }
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 25 * 1024 * 1024) {
                    alert('Video size must be less than 25 MB!');
                    e.target.value = '';
                    return;
                }
                document.getElementById('file-label').innerHTML = `✅ Selected: ${file.name} (${(file.size / (1024*1024)).toFixed(2)} MB)`;
            }
        }

        function uploadVideo() {
            if (currentUser.isGuest) {
                alert('Access Denied! You must open this app inside Telegram with a valid account to upload videos.');
                closeUploadModal();
                return;
            }

            const fileInput = document.getElementById('video-input');
            const caption = document.getElementById('caption-input').value.trim();
            const postBtn = document.getElementById('post-btn');
            
            if (!fileInput.files || fileInput.files.length === 0) {
                return alert('Please select a video first!');
            }
            
            const file = fileInput.files[0];

            postBtn.disabled = true;
            postBtn.innerText = 'Uploading...';
            
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.innerText = '0%';

            const formData = new FormData();
            formData.append('video', file);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', BACKEND_UPLOAD_URL, true);

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percentComplete = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percentComplete + '%';
                    progressBar.innerText = percentComplete + '% (' + (e.loaded / (1024*1024)).toFixed(1) + ' MB / ' + (e.total / (1024*1024)).toFixed(1) + ' MB)';
                }
            };

            xhr.onload = async function() {
                try {
                    if (xhr.status === 200) {
                        const result = JSON.parse(xhr.responseText);
                        if (!result.success) {
                            throw new Error(result.error || 'Upload failed');
                        }

                        const videoUrl = result.videoUrl;
                        progressBar.innerText = 'Saving to Database...';

                        const { error: dbError } = await sbClient.from('videos').insert({
                            user_id: currentUser.id,
                            user_name: currentUser.name,
                            username: currentUser.username,
                            caption: caption,
                            video_url: videoUrl,
                            likes_count: 0,
                            views_count: 0
                        });

                        postBtn.disabled = false;
                        postBtn.innerText = 'Post';
                        progressContainer.style.display = 'none';

                        if (dbError) {
                            alert('Database save failed: ' + dbError.message);
                        } else {
                            closeUploadModal();
                            fileInput.value = '';
                            document.getElementById('caption-input').value = '';
                            document.getElementById('file-label').innerHTML = '📁 Select Video (Max 25 MB)';
                            await loadVideos();
                            showFeed();
                        }
                    } else {
                        throw new Error('Server upload failed with status ' + xhr.status);
                    }
                } catch (err) {
                    alert('Error: ' + err.message);
                    postBtn.disabled = false;
                    postBtn.innerText = 'Post';
                    progressContainer.style.display = 'none';
                }
            };

            xhr.onerror = function() {
                alert('Network error during upload!');
                postBtn.disabled = false;
                postBtn.innerText = 'Post';
                progressContainer.style.display = 'none';
            };

            xhr.send(formData);
        }

        function openMyProfile() {
            document.getElementById('nav-home').classList.remove('active');
            document.getElementById('nav-profile').classList.add('active');
            openUserProfile(currentUser.id, currentUser.name, currentUser.username, true);
        }

        async function openUserProfile(userId, userName, username, isSelf = false) {
            document.querySelectorAll('video').forEach(v => v.pause());
            document.getElementById('feed-view').style.display = 'none';
            const profileEl = document.getElementById('profile-view');
            profileEl.style.display = 'block';

            const userVideos = allVideos.filter(v => v.user_id === userId);
            const totalLikes = userVideos.reduce((sum, v) => sum + (v.likes_count || 0), 0);
            const totalViews = userVideos.reduce((sum, v) => sum + (v.views_count || 0), 0);
            
            const { data: followersData } = await sbClient.from('follows').select('*').eq('following_id', userId);
            const followersCount = followersData ? followersData.length : 0;
            
            const isFollowing = userFollowingSet.has(userId);
            const initial = userName ? userName[0].toUpperCase() : 'U';

            profileEl.innerHTML = `
                ${!isSelf ? `<button class="back-btn" onclick="showFeed()">← Back to Feed</button>` : ''}
                <div class="profile-header">
                    <div class="profile-avatar">${initial}</div>
                    <h2>${escapeHtml(userName)}</h2>
                    <p style="color:#888; font-size:14px;">@${escapeHtml(username || 'user')}</p>
                    
                    ${(!isSelf && !currentUser.isGuest) ? `
                        <button onclick="toggleFollow('${userId}', this)" style="margin-top: 10px; padding: 6px 20px; border-radius: 20px; border: none; font-weight: bold; background: ${isFollowing ? 'rgba(255,255,255,0.3)' : '#2b82ff'}; color: #fff; cursor: pointer;">
                            ${isFollowing ? 'Following' : '+ Follow'}
                        </button>
                    ` : ''}

                    <div class="profile-stats">
                        <div class="stat-box"><span>${userVideos.length}</span><small>Videos</small></div>
                        <div class="stat-box"><span>${followersCount}</span><small>Followers</small></div>
                        <div class="stat-box"><span>${totalLikes}</span><small>Likes</small></div>
                        <div class="stat-box"><span>${totalViews}</span><small>Views</small></div>
                    </div>
                </div>
                <div class="video-grid">
                    ${userVideos.length ? userVideos.map(v => `
                        <div class="grid-item">
                            <video src="${v.video_url}#t=0.001" preload="metadata" muted playsinline onclick="playSingleFromProfile('${v.id}')"></video>
                            <div class="grid-stats"><span>👁️ ${v.views_count || 0}</span><span>♥ ${v.likes_count || 0}</span></div>
                            ${userId === currentUser.id ? `<button class="delete-btn" onclick="deleteVideo('${v.id}')">Delete</button>` : ''}
                        </div>
                    `).join('') : '<p style="grid-column: span 3; text-align:center; color:#666; margin-top:30px;">No videos available</p>'}
                </div>
            `;
        }

        function playSingleFromProfile(videoId) {
            showFeed();
            const idx = allVideos.findIndex(v => v.id === videoId);
            if (idx !== -1) {
                const cards = document.querySelectorAll('.video-card');
                cards[idx]?.scrollIntoView();
            }
        }

        async function deleteVideo(videoId) {
            if (!confirm('Are you sure you want to delete this video?')) return;
            await sbClient.from('videos').delete().eq('id', videoId);
            await loadVideos();
            openMyProfile();
        }

        function reportVideo(videoId) {
            alert('Thank you! This video has been reported for review.');
        }

        function showFeed() {
            document.getElementById('profile-view').style.display = 'none';
            document.getElementById('feed-view').style.display = 'block';
            document.getElementById('nav-home').classList.add('active');
            document.getElementById('nav-profile').classList.remove('active');
        }

        function openUploadModal() { 
            if (currentUser.isGuest) {
                alert('Please open this app inside Telegram to upload videos!');
                return;
            }
            document.getElementById('upload-modal').style.display = 'flex'; 
        }

        function closeUploadModal() { 
            document.getElementById('upload-modal').style.display = 'none'; 
            document.getElementById('progress-container').style.display = 'none';
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        initApp();
    </script>
</body>
</html>
